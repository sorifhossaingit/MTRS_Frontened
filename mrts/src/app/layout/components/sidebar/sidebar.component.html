<div class="w-64 bg-white shadow-lg h-full flex flex-col">

  <!-- Logo -->
  <div class="p-4 text-xl font-bold border-b">
    MR Tracker
  </div>

  <!-- Menu -->
  <nav class="flex-1 p-4 space-y-2">

    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="bg-blue-500 text-white"
       class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition">

      <span class="ml-2">{{ item.label }}</span>
    </a>

  </nav>

</div>
