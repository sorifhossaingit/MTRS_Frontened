<div class="fixed lg:static inset-y-0 left-0 w-72 bg-gradient-to-b from-slate-800 to-slate-900 shadow-2xl h-full flex flex-col sidebar-container z-40"
     [ngClass]="{'translate-x-0': isMobileSidebarOpen || !isSmallScreen, '-translate-x-full': !isMobileSidebarOpen && isSmallScreen}">

  <!-- Logo -->
  <div class="p-4 sm:p-6 text-xl sm:text-2xl font-bold border-b border-slate-700/50 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-b-lg flex items-center justify-between">
    <span class="flex items-center gap-2">
      <span class="text-2xl sm:text-3xl">🏥</span>
      <span>MRTS</span>
    </span>
    <button 
      (click)="closeMobileSidebar()"
      class="lg:hidden text-white text-2xl hover:bg-white/20 p-1 rounded transition">
      ✕
    </button>
  </div>

  <!-- Menu -->
  <nav class="flex-1 p-3 sm:p-4 space-y-1 overflow-y-auto">

    <ng-container *ngFor="let item of menuItems">
      <!-- Parent Item with Children -->
      <div *ngIf="item.children && item.children.length > 0" class="space-y-1">
        <button
          type="button"
          (click)="toggleExpand(item.label)"
          class="w-full flex items-center justify-between px-3 sm:px-4 py-2 sm:py-3 rounded-lg transition text-left group text-sm sm:text-base"
          [ngClass]="{'bg-blue-500/20': isExpanded(item.label), 'text-blue-400': isExpanded(item.label), 'text-slate-300': !isExpanded(item.label)}">
          <span class="flex items-center flex-1 gap-2 sm:gap-3">
            <span class="text-lg sm:text-xl">{{ item.icon }}</span>
            <span class="font-medium">{{ item.label }}</span>
          </span>
          <span class="text-lg transition-transform flex-shrink-0" [ngClass]="{'rotate-180': isExpanded(item.label)}">▼</span>
        </button>

        <!-- Child Items -->
        <div *ngIf="isExpanded(item.label)" class="space-y-1 pl-2 sm:pl-3 animate-fold">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             (click)="isSmallScreen && closeMobileSidebar()"
             routerLinkActive="bg-blue-500/40 text-blue-300 border-l-2 border-blue-400"
             class="flex items-center px-3 sm:px-4 py-2 rounded-lg text-slate-400 hover:text-blue-300 transition text-xs sm:text-sm font-medium border-l-2 border-transparent group-hover:bg-blue-500/10">
            <span class="text-lg mr-1 sm:mr-2 flex-shrink-0">{{ child.icon }}</span>
            <span class="truncate">{{ child.label }}</span>
          </a>
        </div>
      </div>

      <!-- Regular Item (no children) -->
      <a *ngIf="!item.children || item.children.length === 0"
         [routerLink]="item.route"
         (click)="isSmallScreen && closeMobileSidebar()"
         routerLinkActive="bg-blue-600/40 text-blue-300"
         class="flex items-center px-3 sm:px-4 py-2 sm:py-3 rounded-lg text-slate-300 hover:text-blue-400 transition font-medium group text-sm sm:text-base gap-2 sm:gap-3">
        <span class="text-lg sm:text-xl flex-shrink-0">{{ item.icon }}</span>
        <span class="truncate">{{ item.label }}</span>
      </a>
    </ng-container>

  </nav>

  <!-- Footer -->
  <div class="p-3 sm:p-4 border-t border-slate-700/50 bg-slate-900/50 text-center text-xs text-slate-500">
    © 2024 MRTS
  </div>

</div>
