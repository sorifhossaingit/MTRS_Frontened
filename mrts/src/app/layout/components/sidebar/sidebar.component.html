<div class="fixed lg:static inset-y-0 left-0 w-72 bg-gradient-to-b from-slate-800 to-slate-900 shadow-2xl h-full flex flex-col z-40"
     [ngClass]="{'translate-x-0': isMobileSidebarOpen || !isSmallScreen, '-translate-x-full': !isMobileSidebarOpen && isSmallScreen}">

  <!-- Logo -->
  <div class="p-5 text-2xl font-bold border-b border-slate-700 text-white flex justify-between items-center">
    <span class="flex items-center gap-2">
      <span>🏥</span>
      MRTS
    </span>

    <button (click)="closeMobileSidebar()" class="lg:hidden text-xl">✕</button>
  </div>

  <!-- Menu -->
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">

    <ng-container *ngFor="let item of menuItems">

      <!-- Parent -->
      <div *ngIf="item.children?.length">

        <button (click)="toggleExpand(item.label)"
                class="w-full flex justify-between items-center px-3 py-2 rounded-lg text-slate-300 hover:text-blue-400">

          <span class="flex items-center gap-3">
            <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
            {{ item.label }}
          </span>

          <lucide-icon name="chevron-down"
                       class="w-4 h-4 transition"
                       [ngClass]="{'rotate-180': isExpanded(item.label)}">
          </lucide-icon>

        </button>

        <!-- Children -->
        <div *ngIf="isExpanded(item.label)" class="pl-6 space-y-1">

          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="text-blue-400"
             class="flex items-center gap-2 py-2 text-slate-400 hover:text-blue-300">

            <lucide-icon [name]="child.icon" class="w-4 h-4"></lucide-icon>
            {{ child.label }}

          </a>

        </div>

      </div>

      <!-- Single -->
      <a *ngIf="!item.children?.length"
         [routerLink]="item.route"
         routerLinkActive="text-blue-400"
         class="flex items-center gap-3 px-3 py-2 text-slate-300 hover:text-blue-400 rounded-lg">

        <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
        {{ item.label }}

      </a>

    </ng-container>

  </nav>

</div>
