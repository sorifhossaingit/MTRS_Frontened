<header class="flex items-center justify-between bg-gradient-to-r from-blue-600 via-blue-500 to-blue-400 px-4 sm:px-6 md:px-8 py-3 sm:py-4 shadow-lg border-b border-blue-400/30 navbar-header">

  <!-- Left -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Mobile Menu Button -->
    <button 
      (click)="handleToggleSidebar()"
      class="lg:hidden text-white text-2xl hover:bg-white/20 p-2 rounded-lg transition">
      ☰
    </button>

    <div class="text-lg sm:text-2xl font-bold text-white flex items-center gap-2 sm:gap-3 whitespace-nowrap">
      <span class="text-2xl sm:text-3xl">📋</span>
      <span class="hidden sm:inline">Doctor Management System</span>
      <span class="sm:hidden">MRTS</span>
    </div>
  </div>

  <!-- Right -->
  <div class="flex items-center space-x-2 sm:space-x-4 md:space-x-6">

    <!-- Search - Hidden on Mobile -->
    <div class="relative hidden sm:flex">
      <input type="text" placeholder="Search..." class="px-3 sm:px-4 py-2 rounded-full bg-white/20 text-white placeholder-white/70 focus:outline-none focus:bg-white/30 transition w-32 sm:w-48 md:w-64" />
      <span class="absolute right-2 sm:right-3 top-2.5 text-white/50">🔍</span>
    </div>

    <!-- Notification -->
    <button class="relative text-lg sm:text-2xl text-white hover:scale-110 transition">
      🔔
      <span class="absolute -top-1 -right-1 w-2 sm:w-3 h-2 sm:h-3 bg-red-400 rounded-full"></span>
    </button>

    <!-- Profile Dropdown -->
    <div class="relative">
      <button 
        (click)="toggleProfileMenu()"
        class="flex items-center space-x-1 sm:space-x-2 pl-2 sm:pl-4 md:pl-6 border-l border-white/20 hover:bg-white/10 rounded-lg px-2 py-1 transition">
        <img src="https://i.pravatar.cc/40" class="w-7 sm:w-8 md:w-9 h-7 sm:h-8 md:h-9 rounded-full ring-2 ring-white/30" />
        <span class="text-xs sm:text-sm font-medium text-white hidden sm:inline">Admin</span>
      </button>

      <!-- Profile Dropdown Menu -->
      <div *ngIf="showProfileMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl py-2 z-50">
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
        <hr class="my-2" />
        <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
          Logout
        </button>
      </div>
    </div>

  </div>

</header>
