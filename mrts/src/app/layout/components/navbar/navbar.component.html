<header class="flex items-center justify-between bg-gradient-to-r from-blue-600 via-blue-500 to-blue-400 px-4 sm:px-6 md:px-8 py-3 sm:py-4 shadow-lg border-b border-blue-400/30">

  <!-- Left -->
  <div class="flex items-center gap-2 sm:gap-3">

    <!-- Mobile Menu Button -->
    <button 
      (click)="handleToggleSidebar()"
      class="lg:hidden text-white hover:bg-white/20 p-2 rounded-lg transition">

      <lucide-icon name="menu" class="w-6 h-6"></lucide-icon>

    </button>

    <!-- Title -->
    <div class="text-lg sm:text-2xl font-bold text-white flex items-center gap-2 sm:gap-3 whitespace-nowrap">

      <!-- Icon -->
      <div class="bg-white/20 p-1.5 rounded-lg">
        <lucide-icon 
          name="stethoscope" 
          class="w-6 h-6 sm:w-7 sm:h-7 text-white">
        </lucide-icon>
      </div>

      <!-- Text -->
      <span class="hidden sm:inline">Doctor Management System</span>
      <span class="sm:hidden">MRTS</span>

    </div>
  </div>

  <!-- Right -->
  <div class="flex items-center space-x-2 sm:space-x-4 md:space-x-6">

    <!-- Search -->
    <div class="relative hidden sm:flex items-center">

      <input 
        type="text" 
        placeholder="Search..." 
        class="px-3 sm:px-4 py-2 rounded-full bg-white/20 text-white placeholder-white/70 focus:outline-none focus:bg-white/30 transition w-32 sm:w-48 md:w-64 pr-10" 
      />

      <lucide-icon 
        name="search" 
        class="absolute right-3 w-4 h-4 text-white/70">
      </lucide-icon>

    </div>

    <!-- Notification -->
    <button class="relative text-white hover:scale-110 transition">

      <lucide-icon name="bell" class="w-6 h-6 sm:w-7 sm:h-7"></lucide-icon>

      <span class="absolute -top-1 -right-1 w-2 sm:w-3 h-2 sm:h-3 bg-red-400 rounded-full"></span>
    </button>

    <!-- Profile -->
    <div class="relative">
      <button 
        (click)="toggleProfileMenu()"
        class="flex items-center space-x-2 pl-3 border-l border-white/20 hover:bg-white/10 rounded-lg px-2 py-1 transition">

        <img src="https://i.pravatar.cc/40" class="w-8 h-8 rounded-full ring-2 ring-white/30" />

        <span class="text-sm font-medium text-white hidden sm:inline">Admin</span>
      </button>

      <!-- Dropdown -->
      <div *ngIf="showProfileMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl py-2 z-50">

        <a class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          <lucide-icon name="user" class="w-4 h-4"></lucide-icon>
          Profile
        </a>

        <a class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          <lucide-icon name="settings" class="w-4 h-4"></lucide-icon>
          Settings
        </a>

        <hr class="my-2" />

        <button (click)="logout()" class="flex items-center gap-2 w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
          <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
          Logout
        </button>

      </div>
    </div>

  </div>

</header>
