<div class="flex h-screen bg-gradient-to-br from-slate-50 to-slate-100 layout-wrapper">

  <!-- Mobile Overlay -->
  <div 
    *ngIf="sidebarComponent?.isMobileSidebarOpen"
    class="fixed inset-0 bg-black/50 lg:hidden z-30"
    (click)="sidebarComponent?.closeMobileSidebar()"></div>

  <!-- Sidebar -->
  <div #sidebarRef class="sidebar-container">
    <app-sidebar #sidebar></app-sidebar>
  </div>

  <!-- Main -->
  <div class="flex flex-col flex-1 overflow-hidden main-content">

    <!-- Navbar -->
    <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto content-area">
      <div class="p-4 sm:p-6 md:p-8">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

</div>
