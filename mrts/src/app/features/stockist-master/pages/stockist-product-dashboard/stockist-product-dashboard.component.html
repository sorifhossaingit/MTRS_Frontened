<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="Package"></lucide-icon>
     Stockist's Available Product Dashboard
    </h1>

    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
      <button routerLink="/product-master/add-product-master"
        class="bg-blue-600 text-white px-3 sm:px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Plus"></lucide-icon>
        Add Product
      </button>

      <button class="bg-green-600 text-white px-3 sm:px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Upload"></lucide-icon>
        Upload
      </button>
    </div>
  </div>

  <!-- 🔷 KPI CARDS -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Package"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Total Products</p>
        <h2 class="text-xl font-bold">2450</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Active</p>
        <h2 class="text-xl font-bold text-green-600">2100</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="XCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Discontinued</p>
        <h2 class="text-xl font-bold text-red-600">350</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="TrendingUp"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Top Performing</p>
        <h2 class="text-xl font-bold">120</h2>
      </div>
    </div>

  </div>

  <!-- 🔍 FILTER BAR -->
  <div class="card mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">

    <input type="text" placeholder="Search Product / Brand" class="input sm:col-span-2">

    <select class="input">
      <option>Category</option>
    </select>

    <select class="input">
      <option>Division</option>
    </select>

    <select class="input">
      <option>Dosage</option>
    </select>

    <select class="input">
      <option>Status</option>
    </select>

    <button class="bg-gray-200 rounded-lg py-2">Reset</button>

  </div>

  <!-- 📋 PRODUCT TABLE -->
  <div class="card overflow-hidden">

    <div class="overflow-x-auto">

      <table class="min-w-[900px] w-full text-sm">
        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="p-3">Product</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Dosage</th>
            <th>Strength</th>
            <th>MRP</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr class="border-t hover:bg-gray-50">
            <td class="p-3 font-medium">Paracetamol 500</td>
            <td>Crocin</td>
            <td>Analgesic</td>
            <td>Tablet</td>
            <td>500mg</td>
            <td>₹50</td>

            <td>
              <span class="bg-green-100 text-green-700 px-2 py-1 rounded">
                Active
              </span>
            </td>

            <td class="text-center space-x-2">
              <button class="text-blue-600">
                <lucide-icon [img]="Eye"></lucide-icon>
              </button>
              <button class="text-yellow-600">
                <lucide-icon [img]="Pencil"></lucide-icon>
              </button>
              <button class="text-red-600">
                <lucide-icon [img]="Trash2"></lucide-icon>
              </button>
            </td>
          </tr>

        </tbody>
      </table>

    </div>

  </div>

</div>
