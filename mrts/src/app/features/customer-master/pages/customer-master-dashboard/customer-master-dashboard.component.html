<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 Top Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold">Customer Dashboard</h1>

    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
      <button class="bg-blue-600 text-white px-3 sm:px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Plus"></lucide-icon>
        Add Customer
      </button>

      <button class="bg-green-600 text-white px-3 sm:px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Upload"></lucide-icon>
        Upload Excel
      </button>
    </div>
  </div>

  <!-- 🔷 KPI CARDS -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="bg-white p-4 rounded-2xl shadow flex items-center gap-3">
      <lucide-icon [img]="Users"></lucide-icon>
      <div>
        <p class="text-gray-500 text-sm">Total</p>
        <h2 class="text-lg sm:text-xl font-bold">12,540</h2>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow flex items-center gap-3">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      <div>
        <p class="text-gray-500 text-sm">Active</p>
        <h2 class="text-lg sm:text-xl font-bold text-green-600">10,210</h2>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow flex items-center gap-3">
      <lucide-icon [img]="XCircle"></lucide-icon>
      <div>
        <p class="text-gray-500 text-sm">Inactive</p>
        <h2 class="text-lg sm:text-xl font-bold text-red-600">2,330</h2>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow flex items-center gap-3">
      <lucide-icon [img]="TrendingUp"></lucide-icon>
      <div>
        <p class="text-gray-500 text-sm">New This Month</p>
        <h2 class="text-lg sm:text-xl font-bold">320</h2>
      </div>
    </div>

  </div>

  <!-- 🔍 FILTER BAR -->
  <div class="bg-white p-4 rounded-2xl shadow mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">

    <input type="text"
      placeholder="Search name/mobile"
      class="border p-2 rounded-lg sm:col-span-2" />

    <select class="border p-2 rounded-lg">
      <option>Type</option>
      <option>Hospital</option>
      <option>Clinic</option>
      <option>Pharmacy</option>
    </select>

    <select class="border p-2 rounded-lg">
      <option>Status</option>
      <option>Active</option>
      <option>Inactive</option>
    </select>

    <select class="border p-2 rounded-lg">
      <option>State</option>
    </select>

    <button class="bg-gray-200 rounded-lg py-2">Reset</button>

  </div>

  <!-- 📋 CUSTOMER TABLE -->
  <div class="bg-white rounded-2xl shadow overflow-hidden">

    <!-- ✅ SCROLL FOR MOBILE -->
    <div class="overflow-x-auto">

      <table class="min-w-[700px] w-full text-sm">
        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="p-3">Name</th>
            <th>Type</th>
            <th>Contact</th>
            <th>Location</th>
            <th>MR</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr class="border-t hover:bg-gray-50">
            <td class="p-3 font-medium">Apollo Clinic</td>
            <td>Clinic</td>
            <td>
              <div>9876543210</div>
              <div class="text-gray-500 text-xs">apollomail.com</div>
            </td>
            <td>Kolkata</td>
            <td>Rahul</td>
            <td>
              <span class="bg-green-100 text-green-700 px-2 py-1 rounded">
                Active
              </span>
            </td>

            <td class="text-center space-x-2">
              <button class="text-blue-600">
                <lucide-icon [img]="Eye"></lucide-icon>
              </button>
              <button class="text-yellow-600">
                <lucide-icon [img]="Pencil"></lucide-icon>
              </button>
              <button class="text-red-600">
                <lucide-icon [img]="Trash2"></lucide-icon>
              </button>
            </td>
          </tr>

        </tbody>
      </table>

    </div>

  </div>

</div>
