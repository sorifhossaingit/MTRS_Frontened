<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="CalendarCheck"></lucide-icon>
      Attendance Dashboard
    </h1>

    <button class="btn-primary flex items-center gap-2">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      Mark Attendance
    </button>
  </div>

  <!-- 🔷 KPI CARDS -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Users"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Total MR</p>
        <h2 class="text-xl font-bold">{{totalMR}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Present</p>
        <h2 class="text-xl font-bold text-green-600">{{presentCount}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="XCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Absent</p>
        <h2 class="text-xl font-bold text-red-600">{{absentCount}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Clock"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Late</p>
        <h2 class="text-xl font-bold text-orange-500">{{lateCount}}</h2>
      </div>
    </div>

  </div>

  <!-- 🔍 FILTER -->
  <div class="card grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-6">

    <input type="date" class="input" [(ngModel)]="filter.date">

    <select class="input" [(ngModel)]="filter.mr">
      <option value="">All MR</option>
      <option *ngFor="let m of mrList">{{m}}</option>
    </select>

    <select class="input" [(ngModel)]="filter.status">
      <option value="">All Status</option>
      <option>Present</option>
      <option>Absent</option>
      <option>Leave</option>
    </select>

    <button class="bg-gray-200 rounded-lg py-2" (click)="resetFilter()">
      Reset
    </button>

  </div>

  <!-- 📋 TABLE -->
  <div class="card overflow-hidden">

    <div class="overflow-x-auto">

      <table class="min-w-[800px] w-full text-sm">
        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="p-3">Date</th>
            <th>MR Name</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Status</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let a of attendanceList" class="border-t hover:bg-gray-50">

            <td class="p-3">{{a.date}}</td>
            <td>{{a.name}}</td>
            <td>{{a.checkIn}}</td>
            <td>{{a.checkOut}}</td>

            <td>
              <span
                class="px-2 py-1 rounded text-xs"
                [ngClass]="{
                  'bg-green-100 text-green-700': a.status === 'Present',
                  'bg-red-100 text-red-700': a.status === 'Absent',
                  'bg-yellow-100 text-yellow-700': a.status === 'Leave'
                }">
                {{a.status}}
              </span>
            </td>

            <td class="text-center">
              <select class="input w-32" [(ngModel)]="a.status">
                <option>Present</option>
                <option>Absent</option>
                <option>Leave</option>
              </select>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
