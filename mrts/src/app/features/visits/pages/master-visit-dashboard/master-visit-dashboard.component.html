
<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="MapPin"></lucide-icon>
      Visit Dashboard
    </h1>

    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
      <button class="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Plus"></lucide-icon>
        Add Visit
      </button>

      <button class="bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 w-full sm:w-auto justify-center">
        <lucide-icon [img]="Map"></lucide-icon>
        View Map
      </button>
    </div>
  </div>

  <!-- 🔷 KPI CARDS -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="MapPin"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Today Visits</p>
        <h2 class="text-xl font-bold">120</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="ShoppingCart"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Orders</p>
        <h2 class="text-xl font-bold">45</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="DollarSign"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Revenue</p>
        <h2 class="text-xl font-bold">₹1.2L</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Users"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Active MR</p>
        <h2 class="text-xl font-bold">25</h2>
      </div>
    </div>

  </div>

  <!-- 🔍 FILTER BAR -->
  <div class="card mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">

    <input type="text" placeholder="Search MR / Doctor"
      class="input sm:col-span-2">

    <input type="date" class="input">

    <select class="input">
      <option>MR</option>
    </select>

    <select class="input">
      <option>Product</option>
    </select>

    <select class="input">
      <option>Status</option>
      <option>Completed</option>
      <option>Missed</option>
    </select>

    <button class="bg-gray-200 rounded-lg py-2">Reset</button>

  </div>

  <!-- 📋 VISIT TABLE -->
  <div class="card overflow-hidden">

    <div class="overflow-x-auto">

      <table class="min-w-[900px] w-full text-sm">
        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="p-3">Date</th>
            <th>MR</th>
            <th>Doctor</th>
            <th>Location</th>
            <th>Products</th>
            <th>Order Value</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr class="border-t hover:bg-gray-50">
            <td class="p-3">25 Apr</td>
            <td>Rahul</td>
            <td>Dr. Sharma</td>
            <td>Kolkata</td>
            <td>Paracetamol, Antibiotic</td>
            <td>₹2500</td>

            <td>
              <span class="bg-green-100 text-green-700 px-2 py-1 rounded">
                Completed
              </span>
            </td>

            <td class="text-center space-x-2">
              <button class="text-blue-600">
                <lucide-icon [img]="Eye"></lucide-icon>
              </button>
            </td>

          </tr>

        </tbody>
      </table>

    </div>

  </div>

</div>
