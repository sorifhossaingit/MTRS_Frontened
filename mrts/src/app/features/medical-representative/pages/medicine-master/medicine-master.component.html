<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="Package"></lucide-icon>
      Medicine Master
    </h1>

    <div class="flex gap-2 w-full sm:w-auto">
      <input class="input w-full sm:w-64"
        placeholder="Search product..."
        [(ngModel)]="searchText">
    </div>
  </div>

  <!-- 🔷 PRODUCT GRID -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">

    <div *ngFor="let product of products"
         class="card hover:shadow-lg transition">

      <!-- 🖼 Image -->
      <img [src]="product.image"
           class="h-40 w-full object-cover rounded-lg mb-3">

      <!-- 📦 Info -->
      <h3 class="font-semibold text-lg">{{product.name}}</h3>
      <p class="text-sm text-gray-500">{{product.category}}</p>

      <p class="text-sm mt-2">
        <span class="font-medium">Composition:</span>
        {{product.composition}}
      </p>

      <p class="text-sm">
        <span class="font-medium">MRP:</span>
        ₹{{product.price}}
      </p>

      <!-- 🏬 Stockists -->
      <div class="mt-2">
        <p class="text-xs text-gray-500">Available at:</p>
        <div class="flex flex-wrap gap-1 mt-1">
          <span *ngFor="let s of product.stockists"
                class="bg-blue-100 text-blue-600 px-2 py-1 text-xs rounded">
            {{s}}
          </span>
        </div>
      </div>

      <!-- 🔢 Quantity + Order -->
      <div class="flex items-center gap-2 mt-4">

        <input type="number"
               min="1"
               [(ngModel)]="product.qty"
               class="input w-20"
               placeholder="Qty">

        <button
          class="btn-primary flex-1 flex items-center justify-center gap-1"
          (click)="placeOrder(product)">
          <lucide-icon [img]="ShoppingCart"></lucide-icon>
          Order
        </button>

      </div>

    </div>

  </div>

</div>
