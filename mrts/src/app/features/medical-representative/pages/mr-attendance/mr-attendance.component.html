<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="CalendarCheck"></lucide-icon>
      My Attendance
    </h1>
  </div>

  <!-- 🔷 KPI -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">

    <div class="card text-center">
      <p class="text-sm text-gray-500">Present</p>
      <h2 class="text-xl font-bold text-green-600">{{presentCount}}</h2>
    </div>

    <div class="card text-center">
      <p class="text-sm text-gray-500">Absent</p>
      <h2 class="text-xl font-bold text-red-600">{{absentCount}}</h2>
    </div>

    <div class="card text-center">
      <p class="text-sm text-gray-500">Total Days</p>
      <h2 class="text-xl font-bold">{{totalDays}}</h2>
    </div>

  </div>

  <!-- 🔷 MARK ATTENDANCE -->
  <div class="card flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">

    <div>
      <p class="font-medium">Today: {{today | date}}</p>
      <p class="text-sm text-gray-500">
        Status:
        <span [ngClass]="isTodayMarked ? 'text-green-600' : 'text-red-600'">
          {{isTodayMarked ? 'Present' : 'Not Marked'}}
        </span>
      </p>
    </div>

    <button
      class="btn-primary w-full sm:w-auto"
      [disabled]="isTodayMarked"
      (click)="markAttendance()">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      {{isTodayMarked ? 'Marked' : 'Mark Attendance'}}
    </button>

  </div>

  <!-- 🔷 CALENDAR GRID -->
  <div class="card">

    <h2 class="font-semibold mb-4">Monthly Attendance</h2>

    <div class="grid grid-cols-7 gap-2 text-center text-sm">

      <!-- Days -->
      <div *ngFor="let day of days"
           class="p-2 rounded-lg"
           [ngClass]="{
             'bg-green-100 text-green-700': day.status === 'Present',
             'bg-red-100 text-red-700': day.status === 'Absent',
             'bg-gray-100': !day.status
           }">

        <p class="font-medium">{{day.date}}</p>

      </div>

    </div>

  </div>

</div>
