<div class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- HEADER -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <div class="flex items-center space-x-3">
      <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
        <lucide-icon [img]="FileText" class="w-6 h-6"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">MR & Customer Reports</h1>
        <p class="text-sm text-slate-500">
          Select date ranges and relevant entities to generate PDF reports.
        </p>
      </div>
    </div>

    <!-- ERROR ALERT -->
    <div *ngIf="errorMessage"
      class="mt-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-md text-sm flex items-center space-x-2">
      <lucide-icon [img]="AlertCircle" class="w-5 h-5 flex-shrink-0"></lucide-icon>
      <span>{{ errorMessage }}</span>
    </div>
  </div>

  <!-- MAIN FORM CONTAINER -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- FROM DATE -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          From Date <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input type="date" [(ngModel)]="fromDate" name="fromDate"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-sm" />
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <lucide-icon [img]="Calendar" class="w-5 h-5"></lucide-icon>
          </div>
        </div>
      </div>

      <!-- TO DATE -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          To Date <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input type="date" [(ngModel)]="toDate" name="toDate"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-sm" />
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <lucide-icon [img]="Calendar" class="w-5 h-5"></lucide-icon>
          </div>
        </div>
      </div>

      <!-- MEDICAL REPRESENTATIVE SECTION -->
      <div class="col-span-1 md:col-span-2 pt-4 border-t border-slate-100 space-y-4">
        <label class="block text-sm font-semibold text-slate-800">
          Medical Representative Options
        </label>

        <!-- ADDED: MR Search Input -->
        <div>
          <label class="block text-xs text-slate-500 mb-1">Search MR (By Name or Mobile)</label>
          <div class="relative">
            <input type="text" [(ngModel)]="mrSearchTerm" name="mrSearchTerm"
              (ngModelChange)="onMrSearchChange($event)"
              placeholder="Search MR by name or mobile..."
              class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-sm" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [img]="Search" class="w-4 h-4"></lucide-icon>
            </div>
          </div>
        </div>

        <!-- MR Dropdown -->
        <div>
          <label class="block text-xs text-slate-500 mb-1">Select Active Medical Representative</label>
          <div class="relative">
            <select [(ngModel)]="selectedMrId" name="selectedMrId" [disabled]="loadingMRs"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-sm disabled:opacity-50">
              <option [ngValue]="null" disabled selected>
                {{ loadingMRs ? 'Searching Medical Representatives...' : '-- Choose Medical Representative --' }}
              </option>
              <option *ngFor="let mr of mrList" [ngValue]="mr.medicalRepresentativeId">
                {{ mr.name }} ({{ mr.mobile }}) {{ mr.address ? '- ' + mr.address : '' }}
              </option>
            </select>
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [img]="User" class="w-5 h-5" *ngIf="!loadingMRs"></lucide-icon>
              <lucide-icon [img]="Loader2" class="w-5 h-5 animate-spin" *ngIf="loadingMRs"></lucide-icon>
            </div>
          </div>
        </div>

        <!-- Rate Per KM -->
        <div>
          <label class="block text-xs text-slate-500 mb-1">
            Rate Per KM (₹) <span class="text-slate-400">(Required for Visit Report)</span>
          </label>
          <div class="relative">
            <input type="number" step="0.01" min="0" placeholder="e.g. 12.50" [(ngModel)]="ratePerKm" name="ratePerKm"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-sm" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [img]="IndianRupee" class="w-5 h-5"></lucide-icon>
            </div>
          </div>
        </div>

        <!-- MR Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <!-- VISIT PDF BUTTON -->
          <button type="button" (click)="generateVisitReportPdf()"
            [disabled]="downloadingVisitPdf || !selectedMrId || !fromDate || !toDate || ratePerKm === null || ratePerKm < 0"
            class="flex-1 inline-flex justify-center items-center px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
            <lucide-icon [img]="Download" class="w-4 h-4 mr-2" *ngIf="!downloadingVisitPdf"></lucide-icon>
            <lucide-icon [img]="Loader2" class="w-4 h-4 mr-2 animate-spin" *ngIf="downloadingVisitPdf"></lucide-icon>
            <span>{{ downloadingVisitPdf ? 'Generating...' : 'Download Visit Report PDF' }}</span>
          </button>

          <!-- MR PDF BUTTON -->
          <button type="button" (click)="generateMrPdf()"
            [disabled]="downloadingMrPdf || !selectedMrId || !fromDate || !toDate"
            class="flex-1 inline-flex justify-center items-center px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
            <lucide-icon [img]="FileDown" class="w-4 h-4 mr-2" *ngIf="!downloadingMrPdf"></lucide-icon>
            <lucide-icon [img]="Loader2" class="w-4 h-4 mr-2 animate-spin" *ngIf="downloadingMrPdf"></lucide-icon>
            <span>{{ downloadingMrPdf ? 'Generating...' : 'Download MR PDF' }}</span>
          </button>
        </div>
      </div>

      <!-- CUSTOMER SECTION -->
      <div class="col-span-1 md:col-span-2 pt-6 border-t border-slate-200 space-y-4">
        <label class="block text-sm font-semibold text-slate-800">
          Customer Options
        </label>

        <!-- Customer Live Search Input -->
        <div>
          <label class="block text-xs text-slate-500 mb-1">Search Customer (By Name or Mobile Number)</label>
          <div class="relative">
            <input type="text" [(ngModel)]="customerSearchTerm" name="customerSearchTerm"
              (ngModelChange)="onCustomerSearchChange($event)"
              placeholder="Type name or phone number..."
              class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-slate-800 text-sm" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [img]="Search" class="w-4 h-4"></lucide-icon>
            </div>
          </div>
        </div>

        <!-- Customer Select Dropdown -->
        <div>
          <label class="block text-xs text-slate-500 mb-1">Select Customer</label>
          <div class="relative">
            <select [(ngModel)]="selectedCustomerId" name="selectedCustomerId" [disabled]="loadingCustomers"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-slate-800 text-sm disabled:opacity-50">
              
              <option [ngValue]="null" disabled selected>
                {{ loadingCustomers ? 'Searching Customers...' : '-- Choose Customer --' }}
              </option>

              <option *ngFor="let cust of customerList" [ngValue]="cust.customerId">
                {{ cust.name }} 
                {{ cust.mobile ? '(' + cust.mobile + ')' : '' }} 
                {{ cust.routeName ? '[Route: ' + cust.routeName + ']' : '' }}
              </option>
            </select>

            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [img]="Users" class="w-5 h-5" *ngIf="!loadingCustomers"></lucide-icon>
              <lucide-icon [img]="Loader2" class="w-5 h-5 animate-spin" *ngIf="loadingCustomers"></lucide-icon>
            </div>
          </div>
        </div>

        <!-- CUSTOMER PDF BUTTON -->
        <div class="pt-2">
          <button type="button" (click)="generateCustomerPdf()"
            [disabled]="downloadingCustomerPdf || !selectedCustomerId || !fromDate || !toDate"
            class="w-full inline-flex justify-center items-center px-4 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
            <lucide-icon [img]="FileDown" class="w-4 h-4 mr-2" *ngIf="!downloadingCustomerPdf"></lucide-icon>
            <lucide-icon [img]="Loader2" class="w-4 h-4 mr-2 animate-spin" *ngIf="downloadingCustomerPdf"></lucide-icon>
            <span>{{ downloadingCustomerPdf ? 'Generating...' : 'Download Customer Report PDF' }}</span>
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
