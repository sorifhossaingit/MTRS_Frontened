<div class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- HEADER -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

    <div class="flex items-center space-x-3">

      <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">

        <lucide-icon
          [img]="FileText"
          class="w-6 h-6">
        </lucide-icon>

      </div>

      <div>

        <h1 class="text-xl font-bold text-slate-800">
          MR Visit Reports
        </h1>

        <p class="text-sm text-slate-500">
          Select an active Medical Representative and date range
          to generate PDF reports.
        </p>

      </div>

    </div>


    <!-- ERROR -->
    <div
      *ngIf="errorMessage"
      class="mt-4 p-4 bg-red-50 border-l-4 border-red-500
             text-red-700 rounded-r-md text-sm flex items-center space-x-2">

      <lucide-icon
        [img]="AlertCircle"
        class="w-5 h-5 flex-shrink-0">
      </lucide-icon>

      <span>
        {{ errorMessage }}
      </span>

    </div>

  </div>


  <!-- MAIN FORM -->
  <div
    class="bg-white rounded-xl shadow-sm border
           border-slate-200 p-6 space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


      <!-- MR -->
      <div class="col-span-1 md:col-span-2">

        <label
          class="block text-sm font-medium text-slate-700 mb-2">

          Select Active Medical Representative

          <span class="text-red-500">*</span>

        </label>


        <div class="relative">

          <select
            [(ngModel)]="selectedMrId"
            [disabled]="loadingMRs"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50
                   border border-slate-300 rounded-lg
                   focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500 text-slate-800
                   text-sm disabled:opacity-50">

            <option
              [ngValue]="null"
              disabled>

              {{
                loadingMRs
                  ? 'Loading Medical Representatives...'
                  : '-- Choose Medical Representative --'
              }}

            </option>


            <option
              *ngFor="let mr of mrList"
              [ngValue]="mr.medicalRepresentativeId">

              {{ mr.name }}

              ({{ mr.mobile }})

              {{ mr.address ? '- ' + mr.address : '' }}

            </option>

          </select>


          <!-- SELECT ICON -->

          <div
            class="absolute inset-y-0 left-0 pl-3
                   flex items-center pointer-events-none
                   text-slate-400">

            <lucide-icon
              [img]="User"
              class="w-5 h-5"
              *ngIf="!loadingMRs">
            </lucide-icon>


            <lucide-icon
              [img]="Loader2"
              class="w-5 h-5 animate-spin"
              *ngIf="loadingMRs">
            </lucide-icon>

          </div>

        </div>

      </div>


      <!-- FROM DATE -->
      <div>

        <label
          class="block text-sm font-medium text-slate-700 mb-2">

          From Date
          <span class="text-red-500">*</span>

        </label>


        <div class="relative">

          <input
            type="date"
            [(ngModel)]="fromDate"
            class="w-full pl-10 pr-4 py-2.5
                   bg-slate-50 border border-slate-300
                   rounded-lg focus:ring-2
                   focus:ring-blue-500
                   focus:border-blue-500
                   text-slate-800 text-sm" />


          <div
            class="absolute inset-y-0 left-0 pl-3
                   flex items-center pointer-events-none
                   text-slate-400">

            <lucide-icon
              [img]="Calendar"
              class="w-5 h-5">
            </lucide-icon>

          </div>

        </div>

      </div>


      <!-- TO DATE -->
      <div>

        <label
          class="block text-sm font-medium text-slate-700 mb-2">

          To Date
          <span class="text-red-500">*</span>

        </label>


        <div class="relative">

          <input
            type="date"
            [(ngModel)]="toDate"
            class="w-full pl-10 pr-4 py-2.5
                   bg-slate-50 border border-slate-300
                   rounded-lg focus:ring-2
                   focus:ring-blue-500
                   focus:border-blue-500
                   text-slate-800 text-sm" />


          <div
            class="absolute inset-y-0 left-0 pl-3
                   flex items-center pointer-events-none
                   text-slate-400">

            <lucide-icon
              [img]="Calendar"
              class="w-5 h-5">
            </lucide-icon>

          </div>

        </div>

      </div>


      <!-- RATE -->
      <div class="col-span-1 md:col-span-2">

        <label
          class="block text-sm font-medium text-slate-700 mb-2">

          Rate Per KM (₹)

          <span class="text-xs text-slate-400">
            (Required for Visit Report)
          </span>

        </label>


        <div class="relative">

          <input
            type="number"
            step="0.01"
            min="0"
            placeholder="e.g. 12.50"
            [(ngModel)]="ratePerKm"
            class="w-full pl-10 pr-4 py-2.5
                   bg-slate-50 border border-slate-300
                   rounded-lg focus:ring-2
                   focus:ring-blue-500
                   focus:border-blue-500
                   text-slate-800 text-sm" />


          <div
            class="absolute inset-y-0 left-0 pl-3
                   flex items-center pointer-events-none
                   text-slate-400">

            <lucide-icon
              [img]="IndianRupee"
              class="w-5 h-5">
            </lucide-icon>

          </div>

        </div>

      </div>

    </div>


    <!-- BUTTONS -->
    <div
      class="border-t border-slate-200 pt-6
             flex flex-col sm:flex-row gap-4">


      <!-- VISIT PDF -->

      <button
        type="button"
        (click)="generateVisitReportPdf()"
        [disabled]="
          downloadingVisitPdf ||
          !selectedMrId ||
          !fromDate ||
          !toDate ||
          ratePerKm === null ||
          ratePerKm < 0
        "
        class="flex-1 inline-flex justify-center
               items-center px-5 py-2.5
               bg-blue-600 hover:bg-blue-700
               text-white font-medium text-sm
               rounded-lg shadow-sm
               transition-colors duration-150
               disabled:opacity-50
               disabled:cursor-not-allowed">


        <lucide-icon
          [img]="Download"
          class="w-4 h-4 mr-2"
          *ngIf="!downloadingVisitPdf">
        </lucide-icon>


        <lucide-icon
          [img]="Loader2"
          class="w-4 h-4 mr-2 animate-spin"
          *ngIf="downloadingVisitPdf">
        </lucide-icon>


        <span>

          {{
            downloadingVisitPdf
              ? 'Generating...'
              : 'Download Visit Report PDF'
          }}

        </span>

      </button>


      <!-- GENERAL MR PDF -->

      <button
        type="button"
        (click)="generateMrPdf()"
        [disabled]="
          downloadingMrPdf ||
          !selectedMrId ||
          !fromDate ||
          !toDate
        "
        class="flex-1 inline-flex justify-center
               items-center px-5 py-2.5
               bg-emerald-600 hover:bg-emerald-700
               text-white font-medium text-sm
               rounded-lg shadow-sm
               transition-colors duration-150
               disabled:opacity-50
               disabled:cursor-not-allowed">


        <lucide-icon
          [img]="FileDown"
          class="w-4 h-4 mr-2"
          *ngIf="!downloadingMrPdf">
        </lucide-icon>


        <lucide-icon
          [img]="Loader2"
          class="w-4 h-4 mr-2 animate-spin"
          *ngIf="downloadingMrPdf">
        </lucide-icon>


        <span>

          {{
            downloadingMrPdf
              ? 'Generating...'
              : 'Download MR PDF'
          }}

        </span>

      </button>

    </div>

  </div>

</div>
