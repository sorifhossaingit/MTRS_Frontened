<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="ClipboardList"></lucide-icon>
      Order Approval (Admin)
    </h1>
  </div>

  <!-- 🔷 KPI -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Package"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Total Orders</p>
        <h2 class="text-xl font-bold">{{totalOrders}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="Clock"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Pending</p>
        <h2 class="text-xl font-bold text-orange-500">{{pending}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="CheckCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Approved</p>
        <h2 class="text-xl font-bold text-green-600">{{approved}}</h2>
      </div>
    </div>

    <div class="card flex items-center gap-3">
      <lucide-icon [img]="XCircle"></lucide-icon>
      <div>
        <p class="text-sm text-gray-500">Rejected</p>
        <h2 class="text-xl font-bold text-red-600">{{rejected}}</h2>
      </div>
    </div>

  </div>

  <!-- 🔍 FILTER -->
  <div class="card grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-6">

    <input class="input" placeholder="Search Stockist / MR">

    <input type="date" class="input">

    <select class="input">
      <option>All Status</option>
      <option>Pending</option>
      <option>Approved</option>
      <option>Rejected</option>
    </select>

    <button class="bg-gray-200 rounded-lg py-2">Reset</button>

  </div>

  <!-- 📋 TABLE -->
  <div class="card overflow-hidden">

    <div class="overflow-x-auto">

      <table class="min-w-[1000px] w-full text-sm">

        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="p-3">Date</th>
            <th>Stockist</th>
            <th>MR</th>
            <th>Products</th>
            <th>Amount</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let order of orders"
              class="border-t hover:bg-gray-50">

            <td class="p-3">{{order.date}}</td>
            <td>{{order.stockist}}</td>
            <td>{{order.mr}}</td>

            <!-- Products -->
            <td>
              <div class="max-w-[200px] truncate">
                {{order.products}}
              </div>
            </td>

            <td class="font-semibold">₹{{order.amount}}</td>

            <!-- Status -->
            <td>
              <span
                class="px-2 py-1 rounded text-xs"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-700': order.status === 'Pending',
                  'bg-green-100 text-green-700': order.status === 'Approved',
                  'bg-red-100 text-red-700': order.status === 'Rejected'
                }">
                {{order.status}}
              </span>
            </td>

            <!-- Actions -->
            <td class="text-center space-x-2">

              <button class="text-blue-600"
                      (click)="viewOrder(order)">
                <lucide-icon [img]="Eye"></lucide-icon>
              </button>

              <button *ngIf="order.status === 'Pending'"
                      class="btn-success"
                      (click)="updateStatus(order, 'Approved')">
                Approve
              </button>

              <button *ngIf="order.status === 'Pending'"
                      class="btn-danger"
                      (click)="updateStatus(order, 'Rejected')">
                Reject
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
