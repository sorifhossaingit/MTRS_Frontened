<div class="p-4 sm:p-6 bg-gray-100 min-h-screen">

  <!-- 🔷 HEADER -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
      <lucide-icon [img]="PackagePlus"></lucide-icon>
      Add Product
    </h1>

    <button routerLink="/product-master/product-master-dashboard"
      class="px-4 py-2 bg-gray-200 rounded-lg flex items-center gap-2">
      <lucide-icon [img]="ArrowLeft"></lucide-icon>
      Back
    </button>
  </div>

  <!-- 🔷 FORM -->
  <form class="space-y-6">

    <!-- 🟦 BASIC INFO -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="Package"></lucide-icon>
        Basic Information
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input" placeholder="Product Name">
        <input class="input" placeholder="Brand Name">
        <input class="input" placeholder="Generic Name">
      </div>
    </div>

    <!-- 🟪 CLASSIFICATION -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="ClipboardList"></lucide-icon>
        Classification
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input" placeholder="Therapeutic Category">
        <input class="input" placeholder="Division">

        <select class="input">
          <option>Dosage Form</option>
          <option>Tablet</option>
          <option>Syrup</option>
          <option>Injection</option>
        </select>

        <input class="input" placeholder="Strength (e.g., 500mg)">
      </div>
    </div>

    <!-- 🟩 PRICING -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="DollarSign"></lucide-icon>
        Pricing Details
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input class="input" placeholder="MRP">
        <input class="input" placeholder="PTR">
        <input class="input" placeholder="PTS">
      </div>
    </div>

    <!-- 🟨 PACKAGING -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="Box"></lucide-icon>
        Packaging
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input" placeholder="Pack Size">
        <input class="input" placeholder="Units per Box">
      </div>
    </div>

    <!-- 🟫 COMPLIANCE -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="FileCheck"></lucide-icon>
        Compliance
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input" placeholder="Manufacturing License No">
        <input type="date" class="input">
      </div>
    </div>

    <!-- 🟥 MARKETING -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="TrendingUp"></lucide-icon>
        Marketing Details
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="date" class="input">
        
        <select class="input">
          <option>Promotion Priority</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>

        <input class="input md:col-span-2" placeholder="Target Doctors">
      </div>
    </div>

    <!-- 🟦 STATUS -->
    <div class="card">
      <h2 class="section-title">
        <lucide-icon [img]="CheckCircle"></lucide-icon>
        Status
      </h2>

      <div class="flex gap-4">
        <label><input type="radio" name="status"> Active</label>
        <label><input type="radio" name="status"> Discontinued</label>
      </div>
    </div>

    <!-- 🔷 ACTIONS -->
    <div class="flex flex-col sm:flex-row justify-end gap-3">
      <button type="button"
        class="px-4 py-2 bg-gray-300 rounded-lg w-full sm:w-auto">
        Cancel
      </button>

      <button type="submit"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center justify-center gap-2 w-full sm:w-auto">
        <lucide-icon [img]="Save"></lucide-icon>
        Save Product
      </button>
    </div>

  </form>

</div>
