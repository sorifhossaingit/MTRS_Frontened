<div class="min-h-screen flex items-center justify-center relative overflow-hidden font-sans bg-[#f8fafc]">

  <!-- 🌌 BASE GRADIENT CANVAS -->
  <div class="absolute inset-0 bg-gradient-to-br from-gray-50 via-blue-50 to-violet-50"></div>

  <!-- 🌈 FLOWING GRADIENT LAYERS -->
  <div class="absolute -top-40 -left-40 w-[700px] h-[700px] bg-teal-300/40 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute top-1/3 -right-40 w-[800px] h-[800px] bg-cyan-300/40 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-0 left-1/3 w-[600px] h-[600px] bg-violet-300/40 rounded-full blur-3xl animate-pulse"></div>

  <!-- 🌐 FUTURISTIC GRID (DEPTH LAYER) -->
  <div class="absolute inset-0 opacity-[0.07] 
    bg-[linear-gradient(to_right,#000_1px,transparent_1px),linear-gradient(to_bottom,#000_1px,transparent_1px)] 
    bg-[size:60px_60px]">
  </div>

  <!-- 🌊 FLUID WAVE OVERLAY -->
  <div class="absolute bottom-0 w-full opacity-40">
    <svg viewBox="0 0 1440 320" class="w-full">
      <path fill="url(#eliteGrad)" 
        d="M0,224L80,202.7C160,181,320,139,480,138.7C640,139,800,181,960,197.3C1120,213,1280,203,1360,197.3L1440,192V320H0Z">
      </path>
      <defs>
        <linearGradient id="eliteGrad">
          <stop offset="0%" stop-color="#2dd4bf"/>
          <stop offset="100%" stop-color="#a78bfa"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- ✨ GLOBAL LIGHTING -->
  <div class="absolute inset-0 
    bg-[radial-gradient(circle_at_15%_20%,rgba(255,255,255,0.8),transparent_40%),
         radial-gradient(circle_at_85%_30%,rgba(255,255,255,0.6),transparent_40%)]">
  </div>

  <!-- 💡 CARD AURA GLOW -->
  <div class="absolute w-[500px] h-[500px] 
    bg-gradient-to-r from-teal-300 via-cyan-300 to-violet-300 
    blur-3xl opacity-30 rounded-full animate-pulse">
  </div>

  <!-- 🧊 ELITE GLASS CARD -->
  <div class="relative z-10 w-full max-w-md px-10 py-12 
    backdrop-blur-3xl bg-white/60 
    border border-white/30 
    rounded-[24px] 
    shadow-[0_30px_100px_rgba(0,0,0,0.15)]">

    <!-- 🔥 TOP LIGHT EDGE -->
    <div class="absolute inset-0 rounded-[24px] 
      bg-gradient-to-b from-white/60 to-transparent opacity-40 pointer-events-none">
    </div>

    <!-- 🌟 HEADER -->
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">
        MR Tracker
      </h1>
      <p class="text-gray-500 text-sm mt-2 tracking-wide">
        Medical Representative Tracking System
      </p>
    </div>

    <!-- 📝 FORM -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-7">

      <!-- EMAIL -->
      <div class="relative">
        <input type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder=" "
          class="peer w-full px-4 pt-5 pb-2 text-sm 
          bg-white/70 border border-gray-200 rounded-xl 
          focus:outline-none focus:ring-2 focus:ring-teal-400 
          focus:border-transparent 
          transition duration-300 shadow-inner" />
        <label class="absolute left-4 top-2 text-gray-400 text-xs transition-all 
          peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm
          peer-focus:top-2 peer-focus:text-xs peer-focus:text-teal-500">
          Email Address
        </label>
      </div>

      <!-- PASSWORD -->
      <div class="relative">
        <input type="password"
          name="password"
          [(ngModel)]="password"
          required 
          placeholder=" "
          class="peer w-full px-4 pt-5 pb-2 text-sm 
          bg-white/70 border border-gray-200 rounded-xl 
          focus:outline-none focus:ring-2 focus:ring-violet-400 
          focus:border-transparent 
          transition duration-300 shadow-inner" />
        <label class="absolute left-4 top-2 text-gray-400 text-xs transition-all 
          peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm
          peer-focus:top-2 peer-focus:text-xs peer-focus:text-violet-500">
          Password
        </label>
      </div>

      <!-- OPTIONS -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center space-x-2 text-gray-500">
          <input type="checkbox" class="w-4 h-4 accent-teal-500 rounded">
          <span>Remember Me</span>
        </label>
        <a href="#" class="text-teal-500 hover:text-teal-600 transition">
          Forgot Password?
        </a>
      </div>

      <!-- ERROR -->
      <p class="text-sm text-red-400 hidden">Invalid credentials</p>

      <!-- 🚀 ELITE BUTTON -->
      <button type="submit"
        class="relative w-full py-3 rounded-xl text-white font-semibold 
        bg-gradient-to-r from-teal-500 via-cyan-500 to-violet-500 
        shadow-xl shadow-cyan-200/50 
        hover:shadow-2xl hover:-translate-y-0.5 
        transition duration-300 overflow-hidden">

        <!-- Moving Shine Effect -->
        <span class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent 
          translate-x-[-100%] hover:translate-x-[100%] transition duration-700"></span>

        Sign In
      </button>

    </form>

    <!-- FOOTER -->
    <div class="text-center mt-10 text-xs text-gray-400 tracking-wide">
      © 2026 MR Tracker
    </div>
  </div>

  <!-- ✨ FLOATING LIGHT PARTICLES -->
  <div class="absolute top-20 right-20 w-32 h-32 bg-cyan-200 rounded-full blur-2xl opacity-40 animate-pulse"></div>
  <div class="absolute bottom-20 left-20 w-36 h-36 bg-violet-200 rounded-full blur-2xl opacity-40 animate-pulse"></div>

</div>
