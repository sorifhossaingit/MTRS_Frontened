<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700">

  <!-- Card -->
  <div class="w-full max-w-md backdrop-blur-lg bg-white/10 border border-white/20 rounded-2xl shadow-2xl p-8">

    <!-- Logo / Title -->
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-white">MR Tracker</h2>
      <p class="text-sm text-gray-200 mt-1">Welcome back! Please login</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-5">

      <!-- Email -->
      <div class="relative">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-white placeholder-transparent"
        />
        <label
          class="absolute left-4 top-3 text-gray-300 text-sm transition-all 
                 peer-placeholder-shown:top-3 
                 peer-placeholder-shown:text-gray-400 
                 peer-focus:-top-2 peer-focus:text-xs peer-focus:text-white">
          Email Address
        </label>
      </div>

      <!-- Password -->
      <div class="relative">
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-white placeholder-transparent"
        />
        <label
          class="absolute left-4 top-3 text-gray-300 text-sm transition-all 
                 peer-placeholder-shown:top-3 
                 peer-placeholder-shown:text-gray-400 
                 peer-focus:-top-2 peer-focus:text-xs peer-focus:text-white">
          Password
        </label>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full py-3 bg-white text-blue-700 font-semibold rounded-lg hover:bg-gray-100 transition duration-300 shadow-lg">
        Login
      </button>

    </form>

    <!-- Footer -->
    <div class="text-center mt-6 text-sm text-gray-300">
      © 2026 MR Tracker
    </div>

  </div>

</div>
